<!DOCTYPE html>
<html>

<head>
<title>Laptop Products</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.navbar{
background:#232f3e;
color:white;
padding:15px;
font-size:20px;
}

.products{
padding:30px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.price{
color:green;
font-weight:bold;
}

button{
background:orange;
border:none;
padding:10px;
width:100%;
cursor:pointer;
}

</style>

</head>


<body>

<div class="navbar">
💻 Laptop Store
</div>

<div class="products">

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
<h3>Apple MacBook Pro</h3>
<p class="price">$2000</p>
<button onclick="addToCart('Apple MacBook Pro', 2000, 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853">
<h3>Dell XPS 13</h3>
<p class="price">$1500</p>
<button onclick="addToCart('Dell XPS 13', 1500, 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1518770660439-4636190af475">
<h3>HP Pavilion</h3>
<p class="price">$900</p>
<button onclick="addToCart('HP Pavilion', 900, 'https://images.unsplash.com/photo-1518770660439-4636190af475')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7">
<h3>Lenovo ThinkPad</h3>
<p class="price">$1200</p>
<button onclick="addToCart('Lenovo ThinkPad', 1200, 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c">
<h3>Asus ROG Gaming</h3>
<p class="price">$1800</p>
<button onclick="addToCart('Asus ROG Gaming', 1800, 'https://images.unsplash.com/photo-1519389950473-47ba0277781c')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf">
<h3>Acer Predator</h3>
<p class="price">$1600</p>
<button onclick="addToCart('Acer Predator', 1600, 'https://images.unsplash.com/photo-1527443224154-c4a3942d3acf')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=600&q=60">
<h3>MSI Gaming Laptop</h3>
<p class="price">$1700</p>
<button onclick="addToCart('MSI Gaming Laptop', 1700, 'https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=600&q=60')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308">
<h3>Samsung Galaxy Book</h3>
<p class="price">$1300</p>
<button onclick="addToCart('Samsung Galaxy Book', 1300, 'https://images.unsplash.com/photo-1519125323398-675f0ddb6308')">
Add to Cart
</button>
</div>

</div>

</div>
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name,price,image){

let product={
name:name,
price:price,
image:image
};

cart.push(product);

localStorage.setItem("cart",JSON.stringify(cart));

alert(name+" added to cart");

}

</script>
</body>
</html>
