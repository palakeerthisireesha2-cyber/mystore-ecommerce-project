<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:300px;
box-shadow:0 0 10px gray;
text-align:center;
border-radius:8px;
}

input{
width:90%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:95%;
padding:10px;
background:#ff9900;
border:none;
color:white;
font-size:16px;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#e68a00;
}

</style>
</head>

<body>

<div class="container">

<h2>Login</h2>

<input type="email" id="email" placeholder="Enter Email">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

let user = JSON.parse(localStorage.getItem("user"));

if(user && email===user.email && password===user.password){

alert("Login Successful");

window.location.href="index.html";

}
else{

alert("Invalid Email or Password");

}

}

</script>

</body>
</html>
