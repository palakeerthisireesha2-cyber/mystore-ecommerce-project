<!DOCTYPE html>
<html>

<head>
<title>Smartwatch Store</title>
<script>

let cartCount = 0;

function addToCart(product, price){

cartCount++;

alert(product + " added to cart");

document.getElementById("cart-count").innerText = cartCount;

}

</script>
<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.navbar{
background:#232f3e;
color:white;
padding:15px;
font-size:20px;
}

.products{
padding:30px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.price{
color:green;
font-weight:bold;
}

button{
background:orange;
border:none;
padding:10px;
width:100%;
cursor:pointer;
}

</style>

</head>

<body>

<div class="navbar">
⌚ Smartwatch Store
</div>

<div class="products">

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b">
<h3>Apple Watch Series 9</h3>
<p class="price">$499</p>
<button onclick="addToCart('Apple Watch Series 9',499, 'https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b')">
Add to Cart
</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
<h3> Samsung Galaxy Watch 6</h3>
<p class="price">$399</p>
<button onclick="addToCart('Samsung Galaxy Watch 6',399, 'https://images.unsplash.com/photo-1523275335684-37898b6baf30')">
Add to Cart
</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1544117519-31a4b719223d">
<h3>Amazfit GTR 4</h3>
<p class="price">$199</p>
<button onclick="addToCart('Amazfit GTR 4',199, 'https://images.unsplash.com/photo-1544117519-31a4b719223d')">
Add to Cart
</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1579586337278-3befd40fd17a">
<h3>Garmin Venu 2</h3>
<p class="price">$349</p>
<button onclick="addToCart('Garmin Venu 2',349, 'https://images.unsplash.com/photo-1579586337278-3befd40fd17a')">
Add to Cart
</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1606813907291-d86efa9b94db">
<h3>Noise ColorFit Pro</h3>
<p class="price">$89</p>
<button onclick="addToCart('Noise ColorFit Pro',89, 'https://images.unsplash.com/photo-1606813907291-d86efa9b94db')">
Add to Cart
</button>
</div>
<div class="card">
<img src="https://m.media-amazon.com/images/I/61DZclqQ4RL._SX522_.jpg">

<h3>Boat Xtend Smartwatch</h3>
<p class="price">$79</p>
<button onclick="addToCart('Boat Xtend Smartwatch',79, 'https://m.media-amazon.com/images/I/61DZclqQ4RL._SX522_.jpg')">
Add to Cart
</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1517430816045-df4b7de11d1d">
<h3>Fitbit Versa 4</h3>
<p class="price">$229</p>
<button onclick="addToCart('Fitbit Versa 4',229, 'https://images.unsplash.com/photo-1517430816045-df4b7de11d1d')">
Add to Cart
</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12">
<h3>Huawei Watch GT 3</h3>
<p class="price">$259</p>
<button onclick="addToCart('Huawei Watch GT 3',259, 'https://images.unsplash.com/photo-1546868871-7041f2a55e12')">
Add to Cart
</button>
</div>

</div>

</div>
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name,price,image){

let product={
name:name,
price:price,
image:image
};

cart.push(product);

localStorage.setItem("cart",JSON.stringify(cart));

alert(name+" added to cart");

}

</script>
</body>
</html>
