<!DOCTYPE html>
<html>
<head>

<title>Cart</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:80%;
margin:auto;
}

.cart-item{
background:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:15px;
margin-top:10px;
border-radius:8px;
}

.cart-item img{
width:80px;
height:80px;
object-fit:cover;
}

button{
background:red;
color:white;
border:none;
padding:8px;
cursor:pointer;
}

.total{
font-size:22px;
margin-top:20px;
}

.checkout{
background:green;
padding:10px 20px;
color:white;
border:none;
margin-top:10px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h1>🛒 Your Cart</h1>

<div id="cart-items"></div>

<div class="total">
Total: $<span id="total"></span>
</div>

<button class="checkout" onclick="checkout()">Checkout</button>

</div>

<script>

let cart=JSON.parse(localStorage.getItem("cart"))||[];

let cartItems=document.getElementById("cart-items");

let total=0;

function displayCart(){

cartItems.innerHTML="";

total=0;

cart.forEach((item,index)=>{

total+=item.price;

cartItems.innerHTML+=`

<div class="cart-item">

<img src="${item.image}">

<div>

<h3>${item.name}</h3>

<p>$${item.price}</p>

</div>

<button onclick="removeItem(${index})">Remove</button>

</div>

`;

});

document.getElementById("total").innerText=total;

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

displayCart();

}

function checkout(){

if(cart.length==0){
alert("Cart is empty");
return;
}

alert("Order Placed Successfully");

localStorage.removeItem("cart");

location.reload();

}

displayCart();

</script>

</body>
</html>
