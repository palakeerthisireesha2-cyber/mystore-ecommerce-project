<!DOCTYPE html>
<html>

<head>
<title>Headphones Store</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f2f2f2;
}

.navbar{
background:#232f3e;
color:white;
padding:15px;
font-size:20px;
}

.products{
padding:30px;
text-align:center;
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:white;
padding:15px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.price{
color:green;
font-weight:bold;
}

button{
background:orange;
border:none;
padding:10px;
width:100%;
cursor:pointer;
}

</style>

</head>

<body>

<div class="navbar">
🎧 Headphones Store
</div>

<div class="products">

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=600&q=60">
<h3>Sony WH-1000XM5</h3>
<p class="price">$399</p>
<button onclick="addToCart('Sony WH-1000XM5', 399 , 'https://images.unsplash.com/photo-1546435770-a3e426bf472b?auto=format&fit=crop&w=600&q=60')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
<h3>Bose QuietComfort 45</h3>
<p class="price">$329</p>
<button onclick="addToCart('Bose QuietComfort 45', 329, 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1580894894513-541e068a3e2b">
<h3>JBL Tune 760NC</h3>
<p class="price">$149</p>
<button onclick="addToCart('JBL Tune 760NC', 149, 'https://images.unsplash.com/photo-1580894894513-541e068a3e2b')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1484704849700-f032a568e944">
<h3>Beats Studio 3</h3>
<p class="price">$349</p>
<button onclick="addToCart('Beats Studio 3', 349, 'https://images.unsplash.com/photo-1484704849700-f032a568e944')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
<h3>Boat Rockerz 550</h3>
<p class="price">$79</p>
<button onclick="addToCart('Boat Rockerz 550', 79, 'https://images.unsplash.com/photo-1585386959984-a4155224a1ad')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb">
<h3>Skullcandy Crusher</h3>
<p class="price">$199</p>
<button onclick="addToCart('Skullcandy Crusher', 199, 'https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1577174881658-0f30ed549adc?auto=format&fit=crop&w=600&q=60">
<h3>Sennheiser HD 450BT</h3>
<p class="price">$179</p>
<button onclick="addToCart('Sennheiser HD 450BT', 179, 'https://images.unsplash.com/photo-1577174881658-0f30ed549adc?auto=format&fit=crop&w=600&q=60')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1613040809024-b4ef7ba99bc3">
<h3>HyperX Cloud II</h3>
<p class="price">$129</p>
<button onclick="addToCart('HyperX Cloud II', 129, 'https://images.unsplash.com/photo-1613040809024-b4ef7ba99bc3')">Add to Cart</button>
</div>

</div>

</div>
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name,price,image){

let product={
name:name,
price:price,
image:image
};

cart.push(product);

localStorage.setItem("cart",JSON.stringify(cart));

alert(name+" added to cart");

}

</script>
</body>
</html>
